# Neo4j 5 para el modo RAG_STORE=neo4j del RAGannotationAPI compatible.
# Uso:  docker compose -f docker-compose.neo4j.yml up -d
# UI:   http://localhost:7474   (usuario: neo4j  ·  contraseña: neo4jpassword)
services:
  neo4j:
    image: neo4j:5.26
    container_name: tfm-neo4j
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/neo4jpassword
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:
